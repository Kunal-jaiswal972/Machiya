server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz {
    access_log off;
    add_header content-type text/plain;
    return 200 "ok\n";
  }

  # Module workers are rejected outright unless the response carries a JavaScript
  # MIME type, and .mjs is not in every nginx mime.types.
  location ~* \.mjs$ {
    default_type text/javascript;
    add_header cache-control "public, max-age=604800";
  }

  # Hashed assets are immutable; the HTML shell must never be cached.
  location /assets/ {
    expires 1y;
    add_header cache-control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header cache-control "no-store";
  }

  # Client-side routing: every unknown path resolves to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
