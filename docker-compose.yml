# Machiya / RentNear local environment.
#
#   docker compose up -d                  core stack: db, cache, storage, mail, apps
#   docker compose --profile geo up -d    adds Nominatim, OSRM and Overpass
#
# The geo services sit behind a profile on purpose: they cannot start until
# scripts/bootstrap.sh has produced the merged OSM extract and built their
# indexes, and the core stack has to be usable before that happens. All three
# of them — routing, geocoding and POIs — are built from that one extract, so
# they cannot disagree about what exists.
#
# The OSRM images are published for linux/amd64 only, hence the platform pins.
# On Apple silicon they run under emulation and the graph build is slow.
#
# `api` and `worker` declare their `healthcheck:` HERE rather than in their
# Dockerfiles. Compose does read a Dockerfile HEALTHCHECK, so the old
# arrangement worked — but `web` declares `depends_on: api: service_healthy` in
# this file, and a dependency whose condition is defined in a different file is
# one that silently never becomes satisfiable if the image is ever rebuilt,
# retagged or replaced without that layer. The check belongs where the
# dependency is written. `web` keeps its Dockerfile HEALTHCHECK: nothing
# depends on it, so nothing here reads it.

name: machiya

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-machiya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-machiya}
      POSTGRES_DB: ${POSTGRES_DB:-machiya}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./scripts/postgis-healthcheck.sh:/opt/postgis-healthcheck.sh:ro
      - ./scripts/postgres-init/zz-prisma-owns-extensions.sql:/docker-entrypoint-initdb.d/zz-prisma-owns-extensions.sql:ro
    healthcheck:
      test: ['CMD', 'sh', '/opt/postgis-healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio-init:
    # Pinned like every other image. It was the one exception on the grounds
    # that it only creates a bucket and exits — but what it actually does is set
    # the ANONYMOUS ACCESS POLICY (D35), so a silently newer `mc` changing how
    # `anonymous set` behaves would change who can read the bucket. That is not
    # a job to leave on a floating tag.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_USER: ${MINIO_ROOT_USER:-minioadmin}
      MC_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      BUCKET: ${S3_BUCKET:-machiya-listings}
    # Only the variants/ prefix is publicly readable. Originals are uploaded
    # straight from the browser and are NOT validated until the worker inspects
    # their bytes, so a blanket anonymous download policy on the bucket would
    # publish whatever anyone uploaded. `anonymous set none` first, so a bucket
    # created by an earlier version of this file is narrowed rather than left
    # open. See DECISIONS.md D35.
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        set -e;
        mc alias set local http://minio:9000 "$$MC_USER" "$$MC_PASSWORD";
        mc mb --ignore-existing "local/$$BUCKET";
        mc anonymous set none "local/$$BUCKET";
        mc anonymous set download "local/$$BUCKET/variants";
        echo "bucket $$BUCKET ready: variants public, originals private"
    restart: 'no'

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - '${MAILHOG_SMTP_PORT:-1025}:1025'
      - '${MAILHOG_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '1025']
      interval: 15s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: 4000
      API_HOST: 0.0.0.0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-machiya}:${POSTGRES_PASSWORD:-machiya}@postgis:5432/${POSTGRES_DB:-machiya}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-machiya-listings}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:5173}
      GEOCODE_PROVIDER: ${GEOCODE_PROVIDER:-nominatim}
      NOMINATIM_URL: http://nominatim:8080
      OSRM_CAR_URL: http://osrm-car:5000
      OSRM_BIKE_URL: http://osrm-bike:5000
      # The local instance by default. The env var stays so a public mirror is
      # a one-line fallback, never the default — see docs/geo.md.
      OVERPASS_URL: ${OVERPASS_URL:-http://overpass:80/api/interpreter}
      GEO_MANIFEST_PATH: /osm/manifest.json
    volumes:
      # Read-only, and only for manifest.json: the API never touches the
      # extracts themselves. It needs the epoch to prefix its derived cache
      # keys, and the city list to notice that the artifacts predate the
      # running config. See DECISIONS.md D46.
      - ./osm-data:/osm:ro
    ports:
      - '${API_PORT:-4000}:4000'
    healthcheck:
      # /health answers 503 when a dependency is down and 200 otherwise (D10),
      # so this is a real dependency check, not a liveness probe. Node's own
      # fetch is used because the runtime image has neither curl nor wget.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_PORT: 4100
      DATABASE_URL: postgresql://${POSTGRES_USER:-machiya}:${POSTGRES_PASSWORD:-machiya}@postgis:5432/${POSTGRES_DB:-machiya}?schema=public
      REDIS_URL: redis://redis:6379
      FUEL_SCRAPE_CRON: ${FUEL_SCRAPE_CRON:-0 * * * *}
      # The worker sends the enquiry notification mail, so it needs its own SMTP
      # credentials and a link target — the API's copy is not shared with it.
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Machiya <no-reply@machiya.local>}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:5173}
      # The worker is the only process that reads image bytes, so it is the only
      # one that needs access to the private originals prefix.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-machiya-listings}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_FORCE_PATH_STYLE: 'true'
      IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-3}
      KEEP_ORIGINALS: ${KEEP_ORIGINALS:-false}
      IMAGE_CLEANUP_CRON: ${IMAGE_CLEANUP_CRON:-17 * * * *}
      IMAGE_RECONCILE_INTERVAL_MS: ${IMAGE_RECONCILE_INTERVAL_MS:-60000}
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - '${WORKER_PORT:-4100}:4100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
        VITE_MAP_STYLE_URL_DARK: ${VITE_MAP_STYLE_URL_DARK:-https://tiles.openfreemap.org/styles/dark}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'

  # --- geo profile: needs scripts/bootstrap.sh to have run once --------------

  # Geocoding and reverse geocoding, imported from the merged three-city
  # extract. This image imports PBF_PATH on FIRST BOOT into its own volume and
  # then serves; there is no separate import command. See DECISIONS.md D26 for
  # why this is Nominatim rather than Photon.
  nominatim:
    image: mediagis/nominatim:5.3
    profiles: ['geo']
    restart: unless-stopped
    environment:
      PBF_PATH: /osm/merged.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-nominatim}
      IMPORT_WIKIPEDIA: 'false'
      IMPORT_US_POSTCODES: 'false'
      IMPORT_GB_POSTCODES: 'false'
      # Three city extracts, so the import is minutes rather than days.
      THREADS: ${NOMINATIM_THREADS:-4}
    volumes:
      - ./osm-data:/osm:ro
      # Verified against the image: `ls -d /var/lib/postgresql/*/main` inside
      # mediagis/nominatim:5.3 is 16, so this really is the cluster directory.
      # Mount it anywhere else and the multi-minute import repeats on every
      # `docker compose up`. There is deliberately no flatnode volume: that is a
      # file path set through FLATNODE_FILE, and three city extracts are far too
      # small to need one.
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 1gb
    ports:
      - '${NOMINATIM_PORT:-7070}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8080/status || exit 1']
      interval: 30s
      timeout: 10s
      retries: 20
      # A cold import must not be mistaken for a wedged container.
      start_period: 45m

  # Nearby places. Initialised from the SAME merged extract that feeds OSRM and
  # Nominatim, which is the point: with POIs coming from a public mirror's
  # planet-current data, a listing's road graph and its nearby-hospital list
  # could disagree about what exists, and that is unfalsifiable in a bug report.
  # See DECISIONS.md D48.
  #
  # Unlike OSRM there is NO platform pin: `docker manifest inspect
  # wiktorn/overpass-api:v0.7.62.11` returns a manifest list with both
  # linux/arm64 and linux/amd64, so Apple silicon runs this natively.
  overpass:
    image: wiktorn/overpass-api:v0.7.62.11
    profiles: ['geo']
    restart: unless-stopped
    # `chmod 0755 /db` before the image's own entrypoint, and it is load-bearing.
    #
    # `/db` inside the image is the `overpass` user's home directory, mode 0700.
    # A NAMED VOLUME inherits that mode when Docker seeds it from the image —
    # and `fcgiwrap`, which executes every query, runs as `nginx`, not as
    # `overpass`. So the query process cannot traverse into `/db` to open the
    # dispatcher socket, and **every** query fails with
    # `runtime error: open64: 13 Permission denied /db/db//osm3s_osm_base`
    # while the container reports healthy, the import log says it finished, and
    # the 2 GB database sits there intact. A bind mount does not show this
    # because host directories are 0755.
    #
    # `exec` so PID 1 stays the real entrypoint and signals still reach it.
    command: ['/bin/sh', '-c', 'chmod 0755 /db && exec /app/docker-entrypoint.sh']
    environment:
      OVERPASS_MODE: init
      # curl handles file://, so this really is the local extract rather than a
      # download of something that might differ from it.
      OVERPASS_PLANET_URL: file:///osm/merged.osm.pbf
      # Overpass's own init reads OSM XML, not PBF. The image ships osmium, so
      # the conversion happens in place: the entrypoint has already put the
      # planet file at /db/planet.osm.bz2 (whatever its real format) by the
      # time this runs.
      OVERPASS_PLANET_PREPROCESS: >-
        mv /db/planet.osm.bz2 /db/planet.osm.pbf &&
        osmium cat -o /db/planet.osm.bz2 /db/planet.osm.pbf &&
        rm /db/planet.osm.pbf
      # Changeset ids and user attribution are dead weight for a POI lookup and
      # roughly halve the database.
      OVERPASS_META: 'no'
      # No `area` or `is_in` query in this codebase — everything is `around:` —
      # and area generation is a large slice of both init time and the ongoing
      # area-updater process.
      OVERPASS_USE_AREAS: 'false'
      # OVERPASS_DIFF_URL is deliberately UNSET: a fixed snapshot is a feature
      # here, for the same reason the seed is deterministic. Screenshots and bug
      # reports have to be comparable across machines, and POIs drifting under
      # the routing graph is exactly what this service exists to stop.
      OVERPASS_STOP_AFTER_INIT: 'false'
      OVERPASS_MAX_TIMEOUT: ${OVERPASS_MAX_TIMEOUT:-180}
      OVERPASS_ALLOW_DUPLICATE_QUERIES: 'yes'
    volumes:
      - ./osm-data:/osm:ro
      - overpass-db:/db
    ports:
      - '${OVERPASS_PORT:-12345}:80'
    healthcheck:
      # A real interpreter query, not a port probe: the HTTP listener answers
      # long before the database is queryable, so a port check would report
      # healthy in the middle of an import and let the API serve empty POI sets.
      test:
        [
          'CMD-SHELL',
          'curl -fsS --data-urlencode "data=[out:json][timeout:5];node(1);out ids;" http://127.0.0.1/api/interpreter | grep -q elements',
        ]
      interval: 30s
      timeout: 15s
      retries: 20
      # A cold init must not be mistaken for a wedged container.
      start_period: 45m

  osrm-init:
    image: osrm/osrm-backend:v5.25.0
    platform: linux/amd64
    profiles: ['geo']
    volumes:
      - ./osm-data:/data:ro
      - osrm-data:/graph
    entrypoint: ['/bin/bash', '-c']
    command:
      - >
        set -e;
        if [ ! -f /data/merged.osm.pbf ]; then
        echo "osrm-init: /data/merged.osm.pbf is missing.";
        echo "Run 'pnpm bootstrap' first — it downloads the Geofabrik zones, cuts the";
        echo "three city bboxes and merges them into ./osm-data/merged.osm.pbf.";
        exit 1;
        fi;
        src=$$(sha256sum /data/merged.osm.pbf | cut -d' ' -f1);
        echo "extract sha256 $$src";
        for profile in car bicycle; do
        if [ -f "/graph/$$profile/merged.osrm.mldgr" ] && [ "$$(cat /graph/$$profile/source.sha256 2>/dev/null)" = "$$src" ]; then
        echo "$$profile graph already built from this extract, skipping";
        continue;
        fi;
        if [ -f "/graph/$$profile/merged.osrm.mldgr" ]; then
        echo "$$profile graph was built from a different extract; rebuilding";
        fi;
        rm -rf "/graph/$$profile";
        mkdir -p "/graph/$$profile";
        cp /data/merged.osm.pbf "/graph/$$profile/merged.osm.pbf";
        osrm-extract -p "/opt/$$profile.lua" "/graph/$$profile/merged.osm.pbf";
        osrm-partition "/graph/$$profile/merged.osrm";
        osrm-customize "/graph/$$profile/merged.osrm";
        rm -f "/graph/$$profile/merged.osm.pbf";
        echo "$$src" > "/graph/$$profile/source.sha256";
        done;
        echo "osrm graphs ready"
    restart: 'no'

  osrm-car:
    image: osrm/osrm-backend:v5.25.0
    platform: linux/amd64
    profiles: ['geo']
    restart: unless-stopped
    depends_on:
      osrm-init:
        condition: service_completed_successfully
    volumes:
      - osrm-data:/graph
      - ./scripts/osrm-healthcheck.pl:/opt/osrm-healthcheck.pl:ro
    # `--max-table-size` raises the 100-location default for `/table`. Note
    # what it does NOT do: v5.25 applies the limit only to an all-to-all table,
    # so the one-source `/table` the total-cost sort issues is unbounded at any
    # setting — measured, see DECISIONS.md D61. Kept because it is the right
    # value if an all-to-all table is ever added, and because removing it means
    # somebody re-derives that measurement. The bound the sort actually relies
    # on is `TABLE_CHUNK` in apps/api/src/geo/osrm.ts.
    command:
      ['osrm-routed', '--algorithm', 'mld', '--max-table-size', '1000', '/graph/car/merged.osrm']
    ports:
      # 5000 is AirPlay Receiver on macOS, so the default is out of its way.
      - '${OSRM_CAR_PORT:-5100}:5000'
    healthcheck:
      # Perl, not curl: this image ships neither curl nor wget, so the previous
      # curl-based check exited 127 on every run and BOTH OSRM services had
      # reported unhealthy since the day they were added — while answering
      # routes perfectly. Nothing depended on them, so nothing caught it.
      test: ['CMD', 'perl', '/opt/osrm-healthcheck.pl']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  osrm-bike:
    image: osrm/osrm-backend:v5.25.0
    platform: linux/amd64
    profiles: ['geo']
    restart: unless-stopped
    depends_on:
      osrm-init:
        condition: service_completed_successfully
    volumes:
      - osrm-data:/graph
      - ./scripts/osrm-healthcheck.pl:/opt/osrm-healthcheck.pl:ro
    command:
      [
        'osrm-routed',
        '--algorithm',
        'mld',
        '--max-table-size',
        '1000',
        '/graph/bicycle/merged.osrm',
      ]
    ports:
      - '${OSRM_BIKE_PORT:-5001}:5000'
    healthcheck:
      # Same check, same graph-decides-the-profile reasoning as osrm-car: the
      # URL says `driving` because osrm-routed ignores that segment entirely.
      test: ['CMD', 'perl', '/opt/osrm-healthcheck.pl']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  postgis-data:
  redis-data:
  minio-data:
  osrm-data:
  nominatim-data:
  overpass-db:
